# Continuous integration for ZZZ, run by GitHub Actions.
#
# Branch pushes run the checks and the test suite. Tags additionally build a
# release tarball (with the embedded remote server) and upload it as an
# artifact.

name: CI

on:
  workflow_dispatch:
    inputs:
      skip_rust_build:
        description: Skip the Rust build and only run the release job
        type: boolean
        default: false
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
      - test/*
      - test-release/*
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"

jobs:
  checks:
    name: Checks
    if: github.ref_type == 'branch' && !inputs.skip_rust_build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: ./script/linux

      - name: Prefetch locked Cargo dependencies
        run: cargo fetch --locked

      - name: Install supply-chain tools
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          fallback: none
          tool: cargo-deny@0.20.2,zizmor@1.30.1

      - name: Check dependency security policy
        run: cargo deny --workspace --all-features --locked check --hide-inclusion-graph

      - name: Audit GitHub Actions
        run: zizmor --offline --pedantic --min-severity low .github

      - name: Check generated Tree-sitter files
        run: cargo xtask grammars check

      # `check all` formats and lints the docs, which needs Node for Prettier.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Check repository gates
        run: cargo xtask check

      - name: Check formatting
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV and stable check
    if: github.ref_type == 'branch' && !inputs.skip_rust_build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.100.0", "stable"]
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: ./script/linux

      - name: Prefetch locked Cargo dependencies
        run: cargo fetch --locked

      - name: Install Rust toolchain
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update

      - name: Check core crates
        run: cargo +"$TOOLCHAIN" check --locked -p zzz -p gpui -p editor -p project -p workspace

  clippy:
    name: Clippy
    if: github.ref_type == 'branch' && !inputs.skip_rust_build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: ./script/linux

      - name: Configure CI cargo settings
        run: cp .cargo/ci-config.toml .cargo/config.toml

      - name: Prefetch locked Cargo dependencies
        run: cargo fetch --locked

      - name: Run clippy gate
        run: CARGO_NET_OFFLINE=true cargo xtask clippy

      # `gpui` is the crate downstream code documents against, so its rustdoc
      # must build warning-free: a broken intra-doc link is an API doc defect
      # that no compiler gate sees.
      - name: Check gpui documentation
        run: >-
          CARGO_NET_OFFLINE=true RUSTDOCFLAGS="-D warnings"
          cargo doc --no-deps -p gpui

  gpui-platform-checks:
    name: GPUI platform checks
    if: github.ref_type == 'branch' && !inputs.skip_rust_build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: ./script/linux

      - name: Configure CI cargo settings
        run: cp .cargo/ci-config.toml .cargo/config.toml

      - name: Prefetch locked Cargo dependencies
        run: cargo fetch --locked

      - name: Install GPUI cross targets
        run: rustup target add x86_64-apple-darwin x86_64-pc-windows-gnu wasm32-unknown-unknown

      - name: Check GPUI examples
        run: CARGO_NET_OFFLINE=true cargo check --locked -p gpui --examples

      - name: Check GPUI macOS accessibility target
        run: >-
          CARGO_NET_OFFLINE=true cargo check --locked -p gpui_macos --tests
          --target x86_64-apple-darwin --features accessibility

      - name: Check GPUI Windows accessibility target
        run: >-
          CARGO_NET_OFFLINE=true cargo check --locked -p gpui_windows --tests
          --target x86_64-pc-windows-gnu --no-default-features --features accessibility

      - name: Check GPUI Web target
        run: >-
          CARGO_NET_OFFLINE=true RUSTC_BOOTSTRAP=1 cargo check --locked -p gpui_web
          --tests --target wasm32-unknown-unknown

  test:
    name: Test
    if: github.ref_type == 'branch' && !inputs.skip_rust_build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: ./script/linux

      - name: Configure CI cargo settings
        run: cp .cargo/ci-config.toml .cargo/config.toml

      - name: Prefetch locked Cargo dependencies
        run: cargo fetch --locked

      - name: Install cargo-nextest
        uses: taiki-e/install-action@921e2c9f7148d7ba14cd819f417db338f63e733c # nextest
        with:
          tool: nextest

      - name: Run tests
        run: CARGO_NET_OFFLINE=true cargo nextest run --workspace --no-fail-fast --success-output never --show-progress none

  release:
    name: Release
    if: github.ref_type == 'tag' || inputs.skip_rust_build
    runs-on: ubuntu-22.04
    permissions:
      attestations: write # Attach provenance records to tagged release artifacts.
      contents: read
      id-token: write # Obtain the short-lived Sigstore signing certificate.
    env:
      REMOTE_SERVER_TARGET: x86_64-unknown-linux-musl
      # Opt-in until a PGO release has been validated on a runner. Set the
      # repository variable ZZZ_PGO to 1 to build the tarball with a profile.
      ZZZ_PGO: ${{ vars.ZZZ_PGO }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: ./script/linux

      - name: Configure CI cargo settings
        run: cp .cargo/ci-config.toml .cargo/config.toml

      - name: Prefetch locked Cargo dependencies
        run: cargo fetch --locked

      - name: Install release supply-chain tools
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          fallback: none
          tool: cargo-about@0.9.3,cargo-auditable@0.7.7,cargo-cyclonedx@0.5.9

      - name: Prefetch pinned non-Cargo dependencies
        run: cargo xtask ffmpeg ensure --target x86_64-unknown-linux-gnu

      - name: Install PGO training dependencies
        if: vars.ZZZ_PGO == '1'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            xvfb xdotool libegl1 libgl1-mesa-dri mesa-vulkan-drivers
          # The toolchain profile is "minimal" and ships no llvm-profdata;
          # `cargo xtask pgo` refuses a merger from a different LLVM major
          # version.
          rustup component add llvm-tools-preview

      # This runs outside the network namespace below: the instrumented build is
      # never shipped, and the training session needs the X server.
      # `pgo train` starts the instrumented build under Xvfb itself and writes
      # the merged profile into `target/pgo/<fingerprint>/`, so the shipping
      # build below finds it without a hand-written path.
      - name: Generate PGO profile
        if: vars.ZZZ_PGO == '1'
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
          # Make Mesa fall back to the software rasterizer if the Vulkan loader
          # finds no adapter under the virtual display.
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          cargo xtask pgo train --target x86_64-unknown-linux-gnu
          --container never --offline

      # The profiled build shares no compiler work with the instrumented one:
      # RUSTFLAGS differ, so every crate recompiles. Drop the instrumented
      # artifacts to keep the runner under its disk quota.
      - name: Drop instrumented artifacts
        if: vars.ZZZ_PGO == '1'
        run: rm -rf target/release target/x86_64-unknown-linux-gnu

      - name: Bundle Linux tarball
        shell: bash
        run: |
          set -euo pipefail
          export REAL_CARGO="$(command -v cargo)"
          cargo_wrapper_dir="${RUNNER_TEMP}/auditable-cargo"
          mkdir -p "$cargo_wrapper_dir"
          printf '#!/usr/bin/env bash\nexec "$REAL_CARGO" auditable "$@"\n' > "$cargo_wrapper_dir/cargo"
          chmod +x "$cargo_wrapper_dir/cargo"
          # The runner is already Ubuntu 22.04, so the container adds nothing
          # here and cannot be pulled inside the network namespace. A channel
          # build without a profile must say so explicitly rather than fail.
          pgo_mode="off"
          if [[ "${ZZZ_PGO:-}" == "1" ]]; then
            pgo_mode="auto"
          fi
          /usr/bin/unshare --user --map-root-user --net -- \
            /usr/bin/env \
              HOME="$HOME" \
              PATH="$cargo_wrapper_dir:$PATH" \
              REAL_CARGO="$REAL_CARGO" \
              CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
              RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
              CARGO_NET_OFFLINE=true \
              REMOTE_SERVER_TARGET="$REMOTE_SERVER_TARGET" \
              ZZZ_PGO_MODE="$pgo_mode" \
              GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              bash -c 'cd "$GITHUB_WORKSPACE" && cargo xtask build
                --target x86_64-unknown-linux-gnu --formats tar.gz
                --pgo "$ZZZ_PGO_MODE" --offline --container never'

      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          CARGO_NET_OFFLINE=true cargo cyclonedx \
            --manifest-path crates/zzz/Cargo.toml \
            --format json \
            --target x86_64-unknown-linux-gnu \
            --spec-version 1.5
          mv crates/zzz/zzz.cdx.json zzz-linux-sbom.cdx.json

          CARGO_NET_OFFLINE=true cargo cyclonedx \
            --manifest-path crates/remote_server/Cargo.toml \
            --format json \
            --target "$REMOTE_SERVER_TARGET" \
            --spec-version 1.5
          mv crates/remote_server/remote_server.cdx.json zzz-remote-server-sbom.cdx.json

      - name: Collect artifacts
        id: artifacts
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="-${REF_NAME:-dev}"
          arch="$(uname -m)"
          tarball="zzz-linux-${arch}.tar.gz"
          remote_server="zzz-remote-server-linux-${arch}.gz"
          remote_server_dir="$(cargo xtask remote-server build --print-cache --quiet)"
          mv "target/release/${tarball}" "./zzz-linux-${arch}${version}.tar.gz"
          mv "${remote_server_dir}/${remote_server}" "./zzz-remote-server-linux-${arch}${version}.gz"
          checksums="zzz-linux-${arch}${version}.sha256"
          sha256sum \
            "zzz-linux-${arch}${version}.tar.gz" \
            "zzz-remote-server-linux-${arch}${version}.gz" \
            zzz-linux-sbom.cdx.json \
            zzz-remote-server-sbom.cdx.json \
            > "$checksums"
          {
            echo "tarball=zzz-linux-${arch}${version}.tar.gz"
            echo "remote_server=zzz-remote-server-linux-${arch}${version}.gz"
            echo "checksums=$checksums"
          } >> "$GITHUB_OUTPUT"

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifacts.outputs.tarball }}
          path: ${{ steps.artifacts.outputs.tarball }}
          compression-level: 0

      - name: Upload remote server
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifacts.outputs.remote_server }}
          path: ${{ steps.artifacts.outputs.remote_server }}
          compression-level: 0

      - name: Upload supply-chain metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zzz-linux-supply-chain-metadata
          path: |
            ${{ steps.artifacts.outputs.checksums }}
            zzz-linux-sbom.cdx.json
            zzz-remote-server-sbom.cdx.json
          compression-level: 0

      - name: Attest release provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.artifacts.outputs.tarball }}
            ${{ steps.artifacts.outputs.remote_server }}
            ${{ steps.artifacts.outputs.checksums }}
            zzz-linux-sbom.cdx.json
            zzz-remote-server-sbom.cdx.json
