# Generated from xtask::workflows::compliance_check
# Rebuild with `cargo xtask workflows`.
name: compliance_check
env:
  CARGO_TERM_COLOR: always
on:
  schedule:
  - cron: 30 17 * * 2
  workflow_dispatch: {}
jobs:
  scheduled_compliance_check:
    runs-on: ubuntu-latest
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        fetch-depth: 0
    - name: steps::cache_rust_dependencies_namespace
      uses: actions/cache@v5
      with:
        path: ~/.rustup
        key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
        restore-keys: rustup-${{ runner.os }}-
    - id: determine-version
      name: compliance_check::scheduled_compliance_check
      run: |
        VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zed/Cargo.toml | tr -d '[:space:]')
        if [ -z "$VERSION" ]; then
            echo "Could not determine version from crates/zed/Cargo.toml"
            exit 1
        fi
        TAG="v${VERSION}-pre"
        echo "Checking compliance for $TAG"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
    - id: run-compliance-check
      name: compliance_check::scheduled_compliance_check
      run: |
        cargo xtask compliance version "$TAG" --branch main --report-path "compliance-report-${GITHUB_REF_NAME}.md"
      env:
        TAG: ${{ steps.determine-version.outputs.tag }}
      continue-on-error: true
defaults:
  run:
    shell: bash -euxo pipefail {0}
