[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }
# New in Rust 1.98: flags unsuffixed float literals that fall back to `f32`.
# GPUI APIs take `impl Into<f32>` and intentionally rely on this fallback, so
# the lint is noise here rather than an error to fix.
float_literal_f32_fallback = { level = "allow" }
# Opt-in or group-gated rustc lints that are already clean across the whole
# workspace. Denying them here makes the requirement explicit and independent of
# the `--deny warnings` passed by `script/clippy`, so a bare `cargo clippy` run
# enforces the same bar.
explicit_outlives_requirements = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_abi = "deny"
ffi_unwind_calls = "deny"
noop_method_call = "deny"
unused_extern_crates = "deny"
# Warn-by-default in edition 2024 and already clean; denying it pins the
# requirement so an edition or profile change cannot silently relax it.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
negative_feature_names = "deny"
wildcard_dependencies = "deny"
let_underscore_future = "deny"
nonminimal_bool = "deny"
needless_continue = "deny"
redundant_else = "deny"
manual_range_contains = "deny"
match_result_ok = "deny"

declare_interior_mutable_const = "deny"

redundant_clone = "deny"
disallowed_methods = "deny"

# Stronger, low-noise lints. These catch real smells (safety, error handling,
# strict provenance) rather than formatting churn, and each is only promoted
# once the whole workspace is clean for it. To evaluate a candidate, run
# `cargo clippy --workspace --release --all-targets --all-features -- -W
# clippy::the_lint` and count the distinct `file:line` spans; promote it only
# when that count is small enough that the fixes stay reviewable. The current
# set is deliberately kept clear of the high-churn style lints covered by the
# `style` note below.
missing_safety_doc = "deny"
await_holding_lock = "deny"
as_ptr_cast_mut = "deny"
large_stack_arrays = "deny"
manual_map = "deny"
redundant_pattern_matching = "deny"
ptr_as_ptr = "deny"
multiple_unsafe_ops_per_block = "deny"
needless_for_each = "deny"
mem_forget = "deny"

# Clarity and control-flow lints promoted once the whole workspace was fixed
# for them: they replace manual matches and if/panic pairs with the idiom the
# standard library or language now provides (let-else, assert!, checked time
# math, is_some_and, ...).
manual_assert = "deny"
manual_let_else = "deny"
manual_ok_or = "deny"
manual_ok_err = "deny"
manual_clamp = "deny"
manual_is_variant_and = "deny"
bool_to_int_with_if = "deny"
obfuscated_if_else = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_unwrap = "deny"
needless_question_mark = "deny"
mut_mutex_lock = "deny"
empty_line_after_doc_comments = "deny"
inefficient_to_string = "deny"
unchecked_time_subtraction = "deny"

# Idiom lints from the `pedantic` group, promoted once the whole workspace was
# clean for them: they prefer the standard-library idiom (`map_or`/`is_some_and`,
# `filter_map`, `&container` loops, `String::new`, ...) over a hand-rolled match,
# loop, or conversion. Each count stayed small enough to fix in one reviewable
# pass; see the promotion bar in the block above.
map_unwrap_or = "deny"
flat_map_option = "deny"
unnested_or_patterns = "deny"
explicit_deref_methods = "deny"
match_bool = "deny"
implicit_clone = "deny"
manual_string_new = "deny"
single_match_else = "deny"
if_not_else = "deny"
explicit_iter_loop = "deny"
stable_sort_primitive = "deny"
manual_instant_elapsed = "deny"

# Correctness, resource-usage, and clarity lints, promoted once the workspace
# was fixed for them. They flag likely bugs (if-chains comparing the same
# expression, mutable calls erased from `debug_assert!`), missed standard-library
# idioms (`Iterator::empty`, `manual_midpoint`, `Duration` constructors), or
# redundant bounds. `same_length_and_capacity` is allowed inside `extension_api`
# because wit-bindgen emits the pattern in generated code.
comparison_chain = "deny"
debug_assert_with_mut_call = "deny"
borrow_as_ptr = "deny"
ref_as_ptr = "deny"
type_repetition_in_bounds = "deny"
same_length_and_capacity = "deny"
expl_impl_clone_on_copy = "deny"
doc_link_with_quotes = "deny"
ip_constant = "deny"
search_is_some = "deny"
iter_on_empty_collections = "deny"
option_as_ref_cloned = "deny"
clear_with_drain = "deny"
with_capacity_zero = "deny"
unnecessary_join = "deny"
string_lit_as_bytes = "deny"
imprecise_flops = "deny"
manual_midpoint = "deny"
duration_suboptimal_units = "deny"
manual_assert_eq = "deny"
unnecessary_literal_bound = "deny"

# Clarity and idiom lints promoted once the whole workspace was fixed for them.
# `range_plus_one`/`range_minus_one` prefer the slice range that matches the
# intent, `trait_duplication_in_bounds` drops bounds already implied by the
# trait declaration, and the rest replace a hand-rolled pattern with the
# standard-library idiom (`find_map`, empty-peek removal, `insert` return value).
# `same_functions_in_if_condition` is denied globally but allowed with a reason
# at the one site where the "same" call resolves to different target types.
range_plus_one = "deny"
range_minus_one = "deny"
trait_duplication_in_bounds = "deny"
filter_map_next = "deny"
nonstandard_macro_braces = "deny"
unused_peekable = "deny"
set_contains_or_insert = "deny"
same_functions_in_if_condition = "deny"

# Lints that are already clean across the whole workspace as of their
# promotion. Denying them keeps the gate honest and prevents regressions; no
# code changes were required to enable them.
empty_enums = "deny"
disallowed_names = "deny"
precedence = "deny"
verbose_bit_mask = "deny"
manual_ilog2 = "deny"
checked_conversions = "deny"
mut_mut = "deny"
iter_not_returning_iterator = "deny"
manual_div_ceil = "deny"
manual_is_power_of_two = "deny"
manual_rem_euclid = "deny"
manual_next_back = "deny"
cast_enum_constructor = "deny"
derivable_impls = "deny"

# Clarity and API-consistency lints promoted once the whole workspace was fixed
# for them. `equatable_if_let` replaces an `if let` of a literal/unit variant
# with `==` or `matches!`, `elidable_lifetime_names` drops named lifetimes the
# compiler can infer, `enum_glob_use` expands `use Enum::*`, and
# `iter_without_into_iter` keeps `iter` and `IntoIterator` in step on the
# collection types that expose only one of them.
equatable_if_let = "deny"
elidable_lifetime_names = "deny"
enum_glob_use = "deny"
iter_without_into_iter = "deny"

# Correctness lints promoted once the whole workspace was fixed for them.
# `fallible_impl_from` flags `From` impls that can panic, steering callers to
# `TryFrom` or a lossless fallback; `non_send_fields_in_send_ty` flags
# `unsafe impl Send` types whose fields are not `Send`, each of which now
# carries a documented `#[allow(..., reason = ...)]`.
fallible_impl_from = "deny"
non_send_fields_in_send_ty = "deny"

# Lints added in newer Clippy releases that were already clean across the whole
# workspace when scanned. Denying them pins the requirement: they replace a
# hand-rolled pattern with the standard-library idiom (`is_multiple_of`,
# `abs_diff`, `hash`, `c"..."` literals, ...) or catch a likely bug
# (`redundant_locals`, `path_buf_push_overwrite`, `missing_transmute_annotations`).
redundant_locals = "deny"
doc_link_code = "deny"
unnecessary_map_on_constructor = "deny"
unnecessary_result_map_or_else = "deny"
manual_hash_one = "deny"
unnecessary_first_then_check = "deny"
missing_transmute_annotations = "deny"
path_buf_push_overwrite = "deny"
manual_is_multiple_of = "deny"
unnecessary_min_or_max = "deny"
needless_as_bytes = "deny"
manual_abs_diff = "deny"
manual_c_str_literals = "deny"
unnecessary_literal_unwrap = "deny"
unnecessary_sort_by = "deny"
unnecessary_get_then_check = "deny"
redundant_as_str = "deny"

# Clarity lints from the newest Clippy release, promoted once the whole
# workspace was fixed for them: `unnecessary_map_or` prefers the dedicated
# `Option`/`Result` predicates (`is_some_and`/`is_none_or`/`is_ok_and`) over
# `map_or(false|true, ..)`, and `deref_by_slicing` drops the redundant slice in
# `&container[..]` in favour of `as_slice()`/`&*container`.
unnecessary_map_or = "deny"
deref_by_slicing = "deny"

# Clarity and error-handling lints promoted in the eighth batch. Each replaces a
# misleading or hand-rolled pattern with the intent-revealing one: a used item
# no longer carries a leading underscore (`used_underscore_items`,
# `pub_underscore_fields`), a `Debug` impl that intentionally omits fields now
# says so with `finish_non_exhaustive` (`missing_fields_in_debug`), a boxed
# return the caller could box itself is unboxed (`unnecessary_box_returns`), and
# a disabled test states why (`ignore_without_reason`).
used_underscore_items = "deny"
pub_underscore_fields = "deny"
missing_fields_in_debug = "deny"
unnecessary_box_returns = "deny"
ignore_without_reason = "deny"

# The ninth batch promotes lints that catch likely bugs: a `while` loop whose
# condition compares floats (`while_float`) and a sequence of operators that
# looks like a copy-paste error (`suspicious_operation_groupings`) are denied;
# the remaining sites that are intentionally not bugs carry a documented
# `#[allow(..., reason = ...)]`. `case_sensitive_file_extension_comparisons`
# prefers a case-insensitive `Path::extension` over `str::ends_with(".ext")`.
while_float = "deny"
suspicious_operation_groupings = "deny"
case_sensitive_file_extension_comparisons = "deny"

# The tenth batch flattens `else { if ... }` chains into `else if` so the
# control flow reads at a single indentation level.
collapsible_else_if = "deny"

# We currently do not restrict any style rules
# as it slows down shipping code to ZZZ.
#
# Running ./script/clippy can take several minutes, and so it's
# common to skip that step and let CI do it. Any unexpected failures
# (which also take minutes to discover) thus require switching back
# to an old branch, manual fixing, and re-pushing.
#
# In the future we could improve this by either making sure
# ZZZ can surface clippy errors in diagnostics (in addition to the
# rust-analyzer errors), or by having CI fix style nits automatically.
style = { level = "allow", priority = -1 }

# We periodically evaluate style-only lints from the Clippy index, but keep
# them out of the default gate unless they remain low-noise across the whole
# workspace. The low-noise candidates that cleared that bar are promoted in
# the blocks above. Deferred after the last workspace scan, grouped by reason
# (distinct `file:line` counts in parentheses):
#
# - High-noise style: `str_to_string`, `use_self` (4780),
#   `uninlined_format_args`, `semicolon_if_nothing_returned` (3663).
# - Kept alive but never read (RAII/liveness false positives):
#   `collection_is_never_read` (15), `no_effect_underscore_binding` (8),
#   `iter_with_drain` (11, vectors are cleared and refilled).
# - Mechanical but high-churn: `cloned_instead_of_copied` (47),
#   `explicit_into_iter_loop` (34), `iter_on_single_items` (42),
#   `inconsistent_struct_constructor` (33),
#   `unnecessary_struct_initialization` (42), `unnecessary_trailing_comma` (35),
#   `literal_string_with_formatting_args` (34), `format_collect` (13),
#   `transmute_ptr_to_ptr` (3, its replacement pointer cast is not expressible
#   for the unsized types here without tripping `ref_as_ptr`/`ptr_as_ptr`).
# - Behavioral or API-shape changes: `zero_sized_map_values` (11),
#   `float_cmp` (25), `option_option` (8), `implicit_hasher` (10),
#   `branches_sharing_code` (22),
#   `fn_params_excessive_bools` (11), `single_option_map` (4).
# - rustc opt-in lints, similarly deferred: `unused_lifetimes` (15),
#   `trivial_numeric_casts` (34), `trivial_casts` (167),
#   `single_use_lifetimes` (45), `let_underscore_drop` (321),
#   `unused_qualifications` (4051), `unreachable_pub` (1817),
#   `elided_lifetimes_in_paths` (6370). `variant_size_differences` (11) is left
#   off because it would fight the `large_enum_variant` allow below.
# - Evaluated in a later scan and deferred for the same reasons:
#   `unused_async` (291) and `unused_async_trait_impl` (112) mostly fire on
#   trait-mirroring methods kept `async` for signature parity;
#   `match_wildcard_for_single_variants` (116) overlaps the style group;
#   `needless_collect` (91) has false positives where the intermediate
#   collection is load-bearing; `unnecessary_wraps` (90) would reshape
#   intentionally-`Option`/`Result` APIs; `suboptimal_flops` (80) rewrites float
#   math to `mul_add` and shifts results; `assigning_clones` (67) and
#   `format_push_string` (65) are mechanical perf churn; `useless_let_if_seq`
#   (58), `wildcard_imports` (50), `ref_option` (46, invasive signature
#   changes), and `many_single_char_names` (36) are read as style.
#   `into_iter_without_iter` (2) would require changing `Patch`'s existing
#   cloning `IntoIterator` impls to borrow instead, which is a behavior change
#   for callers. `should_panic_without_expect` (1) is the scheduler's "parking
#   forbidden" panic rather than the migration error the test claims to assert,
#   so naming it would encode a test-harness detail.
# - Newer Clippy lints evaluated in the most recent scan are promoted above:
#   `unnecessary_map_or` (66) and `deref_by_slicing` (15) were fixed and added
#   to the deny set in the seventh promotion batch.

# Individual rules that have violations in the codebase:
type_complexity = "allow"

# Motivation: We use `vec![a..b]` a lot when dealing with ranges in text, so
# warning on this rule produces a lot of noise.
single_range_in_vec_init = "allow"

# in Rust it can be very tedious to reduce argument count without
# running afoul of the borrow checker.
too_many_arguments = "allow"

# We often have large enum variants yet we rarely actually bother with splitting them up.
large_enum_variant = "allow"

[workspace.metadata.cargo-machete]
ignored = [
    "bindgen",
    "cbindgen",
    "prost_build",
    "serde",
    "component",
    "documented",
    "sea-orm-macros",
]
