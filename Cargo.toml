default-members = ["crates/zzz"]
# Vendored third-party crates live under `vendor/`. They are path
# dependencies but are kept out of the workspace so that workspace-wide
# lint/fmt/test runs do not touch upstream code.
exclude = [
    "vendor/async-pipe",
    "vendor/dap-types",
    "vendor/font-kit",
    "vendor/gh-workflow",
    "vendor/lsp-types",
    "vendor/notify",
    "vendor/nvim-rs",
    "vendor/reqwest",
    "vendor/scap",
    "vendor/trash",
    "vendor/wgpu",
    "vendor/windows-capture",
    "vendor/wprcontrol",
    "vendor/xim-rs",
]

[workspace.package]
publish = false
edition = "2024"

