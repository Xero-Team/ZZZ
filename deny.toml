# Configuration for `cargo deny check`.
#
# ZZZ is licensed under AGPL-3.0-or-later, but it links a large number of
# third-party crates. This file records the licenses we are willing to accept
# from dependencies, and the sources we are willing to fetch them from.
#
# Run locally with:
#   cargo install cargo-deny
#   cargo deny check

[graph]
targets = []
all-features = true
no-default-features = false

[output]
feature-depth = 1

# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
version = 2
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
git-fetch-with-cli = false
yanked = "deny"
# Stop new abandoned crates from becoming direct workspace dependencies while
# still reporting actionable security vulnerabilities anywhere in the graph.
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "ZZZ only reaches rsa through zpdf's public-key PDF signature verification; it does not call the advisory's affected private-key decryption operations" },
]

# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
version = 2
# SPDX identifiers we accept from dependencies. Keep this list sorted.
allow = [
  "0BSD",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC-BY-4.0",
  "CC-BY-SA-4.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-3.0-only",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "WTFPL",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = []
unused-allowed-license = "allow"

# Workspace crates are all `publish = false`, so they are not checked here;
# `script/check-licenses` is responsible for their per-crate license files.
[licenses.private]
ignore = true
registries = []

# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every Git dependency must be pinned by `rev` in Cargo.toml and explicitly
# admitted here. New Git origins fail the supply-chain gate.
allow-git = [
  "https://github.com/microsoft/python-environment-tools.git",
  "https://github.com/proptest-rs/proptest",
  "https://github.com/RustAudio/rodio",
  "https://github.com/smol-rs/async-task.git",
  "https://github.com/tree-sitter/tree-sitter-cpp",
  "https://github.com/typst/citationberg",
]
