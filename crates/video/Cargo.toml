[package]
name = "video"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/video.rs"
doctest = false

[dependencies]
anyhow.workspace = true
libc.workspace = true
log.workspace = true

# FFmpeg provides the Linux/Windows decoder backend. Release and cross-build
# scripts point `FFMPEG_DIR` at the pinned package downloaded by
# `script/ffmpeg`; direct Cargo builds can set the same variable or use the
# platform's FFmpeg package discovery.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ffmpeg-the-third = { version = "6.0", default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc.workspace = true
