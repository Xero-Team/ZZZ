[package]
name = "memory_report"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/memory_report.rs"

[features]
default = []
# Adds allocator-side heap statistics and the release-unused-memory call. Only
# meaningful when mimalloc is the global allocator; without it the report
# carries process memory alone.
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dependencies]
anyhow.workspace = true
human_bytes.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true

libmimalloc-sys = { version = "0.1", features = ["extended"], optional = true }
mimalloc = { version = "0.1", features = ["extended"], optional = true }
