[package]
name = "gpui_macos"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/gpui_macos.rs"
doctest = false

[features]
default = ["gpui/default"]
accessibility = ["gpui/accessibility", "dep:accesskit", "dep:accesskit_macos"]
test-support = ["gpui/test-support", "gpui_apple/test-support"]
runtime_shaders = ["gpui_apple/runtime_shaders"]
font-kit = ["gpui_apple/font-kit"]
screen-capture = [
    "gpui/screen-capture",
    "dep:core-video",
    "dep:objc2-core-media",
    "dep:objc2-screen-capture-kit",
]

[target.'cfg(target_os = "macos")'.dependencies]
accesskit = { workspace = true, optional = true }
accesskit_macos = { workspace = true, optional = true }
anyhow.workspace = true
block2.workspace = true
collections.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
core-video = { workspace = true, optional = true }
ctor.workspace = true
dispatch2 = { workspace = true, features = ["block2", "objc2"] }
futures.workspace = true
gpui.workspace = true
gpui_apple.workspace = true
image.workspace = true
itertools.workspace = true
log.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSDocumentController",
    "NSDragging",
    "NSDraggingItem",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSScroller",
    "NSSound",
    "NSTrackingArea",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "objc2-uniform-type-identifiers",
] }
objc2-core-graphics = { workspace = true, features = ["CGColor", "objc2"] }
objc2-core-media = { workspace = true, optional = true }
objc2-core-video = { workspace = true, features = ["CVHostTime"] }
objc2-foundation = { workspace = true, features = [
    "NSAttributedString",
    "NSBundle",
    "NSCoder",
    "NSDate",
    "NSEnumerator",
    "NSGeometry",
    "NSLock",
    "NSNull",
    "NSSet",
    "NSThread",
    "NSURL",
    "NSUndoManager",
    "NSValue",
] }
objc2-quartz-core.workspace = true
objc2-screen-capture-kit = { workspace = true, optional = true }
parking_lot.workspace = true
raw-window-handle.workspace = true
semver.workspace = true
smallvec.workspace = true
strum.workspace = true
util.workspace = true
uuid.workspace = true

# When this crate is itself being tested (cargo test -p gpui_macos), its own
# cfg(test) flag enables impls of test-only traits like PlatformHeadlessRenderer
# and PlatformWindow::render_to_image. Those traits/methods only exist in gpui
# when gpui's `test-support` feature is on, so we have to turn that feature on
# as a dev-dependency. The `cfg(test)` flag of a dependent crate doesn't
# propagate to its dependencies, but dev-dependencies do, so this is the
# correct way to enable the feature exactly when needed.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_apple = { workspace = true, features = ["test-support"] }
