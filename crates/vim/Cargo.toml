[package]
name = "vim"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/vim.rs"
doctest = false

[features]
# Marker for the neovim-backed tests. They drive a real `nvim` process, so they stay off
# by default; the dependencies they need are dev-dependencies and are always available to
# the test targets.
neovim = []

[dependencies]
anyhow.workspace = true
collections.workspace = true
command_palette.workspace = true
command_palette_hooks.workspace = true
db.workspace = true
editor.workspace = true
futures.workspace = true
fuzzy.workspace = true
gpui.workspace = true
i18n.workspace = true
itertools.workspace = true
language.workspace = true
log.workspace = true
multi_buffer.workspace = true
picker.workspace = true
project.workspace = true
regex.workspace = true
schemars.workspace = true
search.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
task.workspace = true
text.workspace = true
theme.workspace = true
theme_settings.workspace = true
menu.workspace = true
ui.workspace = true
util.workspace = true
util_macros.workspace = true
vim_mode_setting.workspace = true
workspace.workspace = true
zzz_actions.workspace = true

[dev-dependencies]
async-compat.workspace = true
env_logger.workspace = true
# Vendored from https://github.com/KillTheMule/nvim-rs @ 07f94b78f9356d20b9d43d11c80053a1626fe8ad
nvim-rs = { path = "../../vendor/nvim-rs", features = ["use_tokio"] }
tokio = { version = "1.54", features = ["full"] }
command_palette = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
git_ui = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
indoc.workspace = true
language = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
lsp = { workspace = true, features = ["test-support"] }
markdown_preview.workspace = true
parking_lot.workspace = true
project_panel.workspace = true
outline_panel.workspace = true
release_channel.workspace = true
semver.workspace = true
settings_ui.workspace = true
settings.workspace = true
perf.workspace = true
util = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
search = { workspace = true, features = ["test-support"] }
