[package]
name = "ui_input"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ui_input.rs"

[dependencies]
ui_component_registry.workspace = true
gpui.workspace = true
i18n.workspace = true
log.workspace = true
parking_lot.workspace = true
ui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
theme.workspace = true
theme_settings.workspace = true

[features]
default = []
accessibility = ["gpui/accessibility", "ui/accessibility"]
