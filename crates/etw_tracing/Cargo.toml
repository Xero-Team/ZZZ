wprcontrol = { path = "../../vendor/wprcontrol" }
windows-core = "0.100"
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_Networking_WinSock",
	"Win32_System_Com",
	"Win32_UI_Shell",
] }
