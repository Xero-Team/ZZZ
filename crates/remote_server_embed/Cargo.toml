[package]
name = "remote_server_embed"
description = "Embedded ZZZ remote server archives for SSH/WSL/Docker uploads"
edition.workspace = true
version = "0.1.0"
publish.workspace = true
license = "AGPL-3.0-or-later"

[lib]
path = "src/remote_server_embed.rs"
doctest = false

[lints]
workspace = true

[build-dependencies]
flate2 = "1.1.11"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
