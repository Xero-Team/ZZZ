[package]
name = "zzz_extension_api"
version = "0.8.0"
description = "APIs for creating ZZZ extensions in Rust"
repository = "https://github.com/zed-industries/zed"
documentation = "https://docs.rs/zzz_extension_api"
keywords = ["zzz", "extension"]
edition.workspace = true
# Change back to `true` when we're ready to publish v0.8.0.
publish = false
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/extension_api.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.62"

[package.metadata.component]
target = { path = "wit" }
