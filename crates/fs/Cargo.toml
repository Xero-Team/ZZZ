[package]
name = "fs"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/fs.rs"
test = false

[[test]]
name = "integration"
required-features = ["test-support"]
path = "tests/integration/fs_tests.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
async-lock.workspace = true
async-tar.workspace = true
async-trait.workspace = true
collections.workspace = true
futures.workspace = true
git.workspace = true
gpui.workspace = true
ignore.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true
paths.workspace = true
rope.workspace = true
proto.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
tempfile.workspace = true
text.workspace = true
time.workspace = true
util.workspace = true
vfs.workspace = true
is_executable = "1.0.6"
notify = "8.2.0"
# Vendored from https://github.com/ArturKovacs/trash @ 54e0a2d69fdc058cc2efa19a497ec8f44631d61f
trash = { path = "../../vendor/trash" }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
dunce.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ashpd.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1"

[dev-dependencies]
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
git = { workspace = true, features = ["test-support"] }
vfs = { workspace = true, features = ["test-support"] }

[features]
test-support = ["gpui/test-support", "git/test-support", "util/test-support"]
