[package]
name = "tree-sitter-mermaid"
description = "mermaid grammar for the tree-sitter parsing library"
version = "0.0.1"
keywords = ["incremental", "parsing", "mermaid"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-mermaid"
edition = "2018"
license = "MIT"

build = "bindings/rust/build.rs"
include = [
  "LICENSE",
  "bindings/rust/*",
  "grammar.js",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.4"

[dev-dependencies]
tree-sitter = { workspace = true }
