[package]
name = "tree-sitter-powershell"
description = "Powershell grammar for tree-sitter"
version = "0.26.6"
edition = "2021"
license = "MIT"
build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.11"

[dev-dependencies]
tree-sitter = { workspace = true }

# Vendored upstream grammar crate: deliberately outside the ZZZ `[workspace.lints]` deny set.
[lints]
