[package]
name = "tree-sitter-csv"
description = "CSV and delimited text grammars for tree-sitter"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "bindings/rust/build.rs"
include = [
  "LICENSE",
  "bindings/rust/*",
  "common/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tsv/grammar.js",
  "tsv/src/*",
  "psv/grammar.js",
  "psv/src/*",
  "semicolon/grammar.js",
  "semicolon/src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.4"

[dev-dependencies]
tree-sitter = { workspace = true }
