[package]
name = "tree-sitter-scheme"
description = "Scheme grammar for the tree-sitter parsing library"
version = "0.2.0"
keywords = ["incremental", "parsing", "scheme"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/6cdh/tree-sitter-scheme"
edition = "2021"
license = "MIT"

build = "bindings/rust/build.rs"
include = [
  "LICENSE",
  "bindings/rust/*",
  "grammar.js",
  "src/grammar.json",
  "src/node-types.json",
  "src/parser.c",
  "src/tree_sitter/*.h",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = { workspace = true }
