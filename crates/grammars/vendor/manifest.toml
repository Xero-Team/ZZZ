tree-sitter-cli-version = "0.26.11"
abi = 15

[[packages]]
directory = "tree-sitter-cmake"
compile-name = "tree-sitter-cmake"
display-name = "CMake"

[[packages.grammars]]
input = "src/grammar.json"
output = "src"
symbol = "tree_sitter_cmake"
language-constant = "LANGUAGE"
node-types-constant = "NODE_TYPES"
display-name = "CMake"

[[packages.queries]]
constant = "HIGHLIGHTS_QUERY"
path = "queries/highlights.scm"

[[packages.queries]]
constant = "INJECTIONS_QUERY"
path = "queries/injections.scm"

