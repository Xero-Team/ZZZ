[package]
edition = "2021"
name = "tree-sitter-toml-ng"
version = "0.7.0"
authors = [
    "Ika <ikatyang@gmail.com>",
    "Amaan Qureshi <amaanq12@gmail.com>",
]
build = "bindings/rust/build.rs"
include = [
    "bindings/rust/*",
    "grammar.js",
    "queries/*",
    "src/*",
    "tree-sitter.json",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "TOML grammar for tree-sitter"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "toml"]
categories = ["parsing", "text-editors"]
license = "MIT"
repository = "https://github.com/tree-sitter-grammars/tree-sitter-toml"

[lib]
name = "tree_sitter_toml_ng"
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.4"

[dev-dependencies]
tree-sitter = { workspace = true }
