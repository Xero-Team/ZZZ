path_suffixes = [
  ".containerignore",
  ".cursorignore",
  ".dockerignore",
  ".eslintignore",
  ".fdignore",
  ".gitignore",
  ".git-blame-ignore-revs",
  ".ignore",
  ".npmignore",
  ".prettierignore",
  ".rgignore",
  ".vscodeignore",
]
name = "Git Ignore"
grammar = "gitignore"
line_comments = ["# "]
autoclose_before = "]"
brackets = [
  { start = "[", end = "]", close = true, newline = false },
]
