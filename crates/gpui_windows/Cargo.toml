[package]
name = "gpui_windows"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/gpui_windows.rs"

[features]
default = ["gpui/default"]
accessibility = ["gpui/accessibility", "dep:accesskit", "dep:accesskit_windows"]
test-support = ["gpui/test-support"]
screen-capture = ["gpui/screen-capture", "scap"]

[dependencies]
gpui.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
accesskit = { workspace = true, optional = true }
accesskit_windows = { workspace = true, optional = true }
anyhow.workspace = true
collections.workspace = true
futures.workspace = true
image.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
rand.workspace = true
raw-window-handle = "0.6"
smallvec.workspace = true
util.workspace = true
uuid.workspace = true
windows.workspace = true
# These crates must stay on the same ABI generation as `windows`.
windows-core = "0.62"
windows-numerics = "0.3.1"
windows-registry = "0.6.1"

[target.'cfg(target_os = "windows")'.dependencies.scap]
workspace = true
optional = true

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-registry = "0.6.1"

[target.'cfg(target_os = "windows")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
