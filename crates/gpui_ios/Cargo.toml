[package]
name = "gpui_ios"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/gpui_ios.rs"
crate-type = ["staticlib", "rlib"]
doctest = false

[[example]]
name = "ios"
path = "examples/ios.rs"
test = false
bench = false

[[test]]
name = "text_input"
path = "tests/text_input.rs"
harness = false

[features]
runtime_shaders = ["gpui_apple/runtime_shaders"]

[target.'cfg(target_os = "ios")'.dev-dependencies]
gpui_platform.workspace = true
objc2-ui-kit = { workspace = true, features = ["UIConversationContext"] }
slotmap.workspace = true
# When this crate is itself being tested (`cargo test -p gpui_ios`), its own
# cfg(test) flag enables tests that need gpui's test harness, whose traits only
# exist when gpui's `test-support` feature is on. The cfg(test) flag of a
# dependent crate does not propagate to its dependencies, but dev-dependencies
# do, so this is the correct way to enable the feature exactly when needed.
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "ios")'.dependencies]
anyhow.workspace = true
block2.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_apple = { workspace = true, features = ["font-kit"] }
log.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSThread", "NSOperation", "NSUserActivity", "block2"] }
objc2-ui-kit.workspace = true
objc2-quartz-core = { workspace = true, features = ["CADisplayLink"] }
objc2-security.workspace = true
objc2-core-foundation = { workspace = true, default-features = true }
parking_lot.workspace = true
raw-window-handle.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v5"] }
