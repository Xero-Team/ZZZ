syntax = "proto3";
package zzz.messages;

import "vfs.proto";

message Timestamp {
  uint64 seconds = 1;
  uint32 nanos = 2;
}

message File {
  uint64 worktree_id = 1;
  optional uint64 entry_id = 2;
  reserved 3;
  reserved "path";
  Timestamp mtime = 4;
  bool is_deleted = 5;
  bool is_historic = 6;
  VfsPathV2 vfs_path = 7;
  ResourceIdV2 resource_id = 8;
}

message Entry {
  uint64 id = 1;
  bool is_dir = 2;
  reserved 3;
  reserved "path";
  uint64 inode = 4;
  Timestamp mtime = 5;
  bool is_ignored = 7;
  bool is_external = 8;
  reserved 6;
  reserved 9;
  bool is_fifo = 10;
  optional uint64 size = 11;
  optional string canonical_path = 12;
  bool is_hidden = 13;
  bool is_unloaded = 14;
  VfsPathV2 vfs_path = 15;
  ResourceIdV2 resource_id = 16;
}

message AddWorktree {
  reserved 1;
  reserved "path";
  uint64 project_id = 2;
  bool visible = 3;
  NativePathV2 path_v2 = 4;
}

message AddWorktreeResponse {
  uint64 worktree_id = 1;
  reserved 2, 3;
  reserved "canonicalized_path", "root_repo_common_dir";
  bool root_repo_is_linked_worktree = 4;
  NativePathV2 canonicalized_path_v2 = 5;
  NativePathV2 root_repo_common_dir_v2 = 6;
  VfsPathV2 vfs_root = 7;
}

message RemoveWorktree {
  uint64 worktree_id = 1;
}

message GetPathMetadata {
  uint64 project_id = 1;
  reserved 2;
  reserved "path";
  NativePathV2 path_v2 = 3;
}

message GetPathMetadataResponse {
  bool exists = 1;
  reserved 2;
  reserved "path";
  bool is_dir = 3;
  NativePathV2 path_v2 = 4;
}

message WorktreeMetadata {
  uint64 id = 1;
  string root_name = 2;
  bool visible = 3;
  reserved 4, 5;
  reserved "abs_path", "root_repo_common_dir";
  bool root_repo_is_linked_worktree = 6;
  NativePathV2 abs_path_v2 = 7;
  NativePathV2 root_repo_common_dir_v2 = 8;
  VfsPathV2 vfs_root = 9;
}

message ProjectPath {
  uint64 worktree_id = 1;
  reserved 2;
  reserved "path";
  VfsPathV2 vfs_path = 3;
}

message ListRemoteDirectoryConfig {
  bool is_dir = 1;
}

message ListRemoteDirectory {
  uint64 dev_server_id = 1;
  reserved 2;
  reserved "path";
  ListRemoteDirectoryConfig config = 3;
  NativePathV2 path_v2 = 4;
}

message RemoteDirectoryEntry {
  VfsPathComponentV2 name = 1;
  bool is_dir = 2;
}

message ListRemoteDirectoryResponse {
  reserved 1, 2;
  reserved "entries", "entry_info";
  repeated RemoteDirectoryEntry entries_v2 = 3;
}

message CreateProjectEntry {
  uint64 project_id = 1;
  uint64 worktree_id = 2;
  reserved 3;
  reserved "path";
  bool is_directory = 4;
  optional bytes content = 5;
  VfsPathV2 path_v2 = 6;
}

message RenameProjectEntry {
  uint64 project_id = 1;
  uint64 entry_id = 2;
  reserved 3;
  reserved "new_path";
  uint64 new_worktree_id = 4;
  VfsPathV2 new_path_v2 = 5;
}

message CopyProjectEntry {
  uint64 project_id = 1;
  uint64 entry_id = 2;
  reserved 3;
  reserved "new_path";
  uint64 new_worktree_id = 5;
  reserved 4;
  VfsPathV2 new_path_v2 = 6;
}

message DeleteProjectEntry {
  uint64 project_id = 1;
  uint64 entry_id = 2;
  bool use_trash = 3;
}

message ExpandProjectEntry {
  uint64 project_id = 1;
  uint64 entry_id = 2;
}

message ExpandProjectEntryResponse {
  uint64 worktree_scan_id = 1;
}

message ExpandAllForProjectEntry {
  uint64 project_id = 1;
  uint64 entry_id = 2;
}

message ExpandAllForProjectEntryResponse {
  uint64 worktree_scan_id = 1;
}

message ProjectEntryResponse {
  optional Entry entry = 1;
  uint64 worktree_scan_id = 2;
}

message UpdateWorktreeSettings {
  uint64 project_id = 1;
  uint64 worktree_id = 2;
  reserved 3;
  reserved 6;
  reserved "path", "outside_worktree";
  optional string content = 4;
  optional LocalSettingsKind kind = 5;
  oneof path_v2 {
    VfsPathV2 vfs_path = 7;
    NativePathV2 native_path = 8;
  }
}

enum LocalSettingsKind {
  Settings = 0;
  Tasks = 1;
  Editorconfig = 2;
  Debug = 3;
}

message UpdateUserSettings {
  uint64 project_id = 1;
  string contents = 2;
}

message TrustWorktrees {
  uint64 project_id = 1;
  repeated PathTrust trusted_paths = 2;
}

message PathTrust {
  oneof content {
    uint64 worktree_id = 2;
  }

  NativePathV2 abs_path_v2 = 4;

  reserved 1, 3;
  reserved "abs_path";
}

message RestrictWorktrees {
  uint64 project_id = 1;
  repeated uint64 worktree_ids = 3;

  reserved 2;
}

// Request from the remote server to the client to allocate a new worktree ID.
// This allows the client to maintain a single WorktreeIdCounter that prevents
// ID collisions when connected to multiple remote servers.
message AllocateWorktreeId {
  uint64 project_id = 1;
}

message AllocateWorktreeIdResponse {
  uint64 worktree_id = 1;
}
