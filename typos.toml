[files]
ignore-files = true
ignore-hidden = false
extend-exclude = [
    ".git/",

    # Typewriter model names used for agent branch names aren't typos.
    "crates/agent_ui/src/branch_names.rs",

    # Contributor names aren't typos.
    ".mailmap",

    # File suffixes aren't typos.
    "crates/theme/src/icon_theme.rs",
    "crates/extensions_ui/src/extension_suggest.rs",

    # Vim makes heavy use of partial typing tables.
    "crates/vim/",
    # Editor, file finder, and fuzzy matching rely on partial typing and custom in-string syntax.
    "crates/file_finder/src/file_finder_tests.rs",
    "crates/fuzzy_nucleo/src/strings.rs",
    "crates/editor/src/editor_tests.rs",
    # There are some names in the test data that are incorrectly flagged as typos.
    "crates/git/test_data/blame_incremental_complex",
    "crates/git/test_data/golden/blame_incremental_complex.json",
    # We have some base64-encoded data that is incorrectly being flagged.
    "crates/rpc/src/auth.rs",
    # glsl isn't recognized by this tool.
    "extensions/glsl/languages/glsl/",
    # Protols is the name of the language server.
    "extensions/proto/extension.toml",
    "extensions/proto/src/language_servers/protols.rs",
    # Windows likes its abbreviations.
    "crates/gpui_windows/src/directx_renderer.rs",
    "crates/gpui_windows/src/events.rs",
    "crates/gpui_windows/src/direct_write.rs",
    "crates/gpui_windows/src/window.rs",
    # Some typos in the base mdBook CSS.
    "docs/theme/css/",
    # Automatically generated JS.
    "docs/theme/c15t@*.js",
    # Spellcheck triggers on `|Fixe[sd]|` regex part.
    "script/danger/dangerfile.ts",
    # File type extensions are not typos
    "crates/zzz/resources/windows/zzz.iss",
    # typos-cli doesn't understand our `vˇariable` markup
    "crates/editor/src/hover_links.rs",
    # typos-cli doesn't understand `setis` is intentional test case
    "crates/editor/src/code_completion_tests.rs",
    # Linux repository structure is not a valid text, hence we should not check it for typos
    "crates/project_panel/benches/linux_repo_snapshot.txt",
    # Some multibuffer test cases have word fragments that register as typos
    "crates/multi_buffer/src/multi_buffer_tests.rs",
    # Macos apis
    "crates/gpui_macos/src/dispatcher.rs",
    # Tests contain `baˇr` that cause `"ba" should be "by" or "be".`-like false-positives
    "crates/editor/src/document_symbols.rs",
    # Vendored tree-sitter grammars are generated third-party code.
    "crates/grammars/vendor/",
    # Vendored third-party crates are not ours to spellcheck.
    "vendor/",
    # These files quote upstream commit subjects verbatim.
    "docs/src/development/upstream-rejected.tsv",
    "docs/src/development/upstream/",
    # Upstream tree-sitter query files.
    "crates/grammars/src/powershell/",
    # Windows command-line help text, which contains flags like `/fo csv`.
    "crates/grammars/src/cmd/testdata/",
    # Vendored JSON schema text.
    "crates/json_schema_store/src/schemas/",
    # Path corpora and progress records, which contain bare path fragments.
    "crates/vfs/test_data/path_corpus.json",
    "docs/src/development/vfs-refactor-progress.md",
    "docs/src/development/gpui-refactor-progress.md",
    "docs/src/development/database/progress.md",
    "docs/src/development/text-rendering-research/evidence.tsv",
    ".agents/skills/repository-research/references/codebase-analysis.md",
]

[default]
extend-ignore-re = [
    # PNG is a file format, not a typo
    "PNG",
    'cl\[ist]',
    '\[lan\]guage',
    '"ba"',
    "doas",
    # ProtoLS crate with tree-sitter Protobuf grammar.
    "protols",
    # x11rb SelectionNotifyEvent struct field
    "requestor",
    # macOS version
    "Big Sur",
    # Not an actual typo but an intentionally invalid color, in `color_extractor`
    "#fof",
    # Stripped version of reserved keyword `type`
    "typ",
    # AMD GPU Services
    "ags",
    # AMD GPU Services
    "AGS",
    # "noet" is a vim variable (ideally to ignore locally)
    "noet",
    # Yarn Plug'n'Play
    "PnP",
    # `image` crate method: Delay::from_numer_denom_ms
    "numer",
    # `grammers` is the Telegram MTProto client library we depend on.
    "grammers",
    # ScreenCaptureKit bindings keep Apple's own naming.
    "scap",
    "Scap",
    # AMD GPU Services, same as the `ags`/`AGS` entries above.
    "Ags",
    # Deliberate search-token prefix in the repository-research skill script.
    "retriev",
    # Vim's `:elete` command.
    ":elete",
    # `writeable_path_from_extension` follows wasmtime's WASI spelling.
    "writeable",
    # Valid variant of "unparsable", used in test names.
    "unparseable",
    # Mermaid generates `.composit` and `.alt-composit` SVG classes itself.
    "composit",
    # Regex fragments that spell out `#[ignore]` a character at a time.
    "ignor",
    # Simulated backspace key name in command-palette tests.
    "bcksp",
    # SQL type substrings matched by the MySQL type sniffer.
    "DOUB",
    # `café` in the identifier-sanitizing test.
    "café",
    # Partial-typing search query in the settings search test.
    '"fo"',
    '"ba"',
    '"bck"',
    # `/fo csv` is a Windows `driverquery`/`tasklist` flag, not prose.
    "/fo ",
    # Vim's bracket notation for command abbreviations.
    '\[elete\]',
    # Font file name and a synthetic test string.
    "SVGinOT",
    "GHIzJ",
    # Output of the identifier normalizer for `café-option`.
    "CAF__OPTION",
]
check-filename = true
